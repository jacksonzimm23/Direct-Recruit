<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1128">
    <link rel="apple-touch-icon" href="../icons/ios/180.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/dr-logo.png">
    <title>Coach Dashboard - Direct Recruit</title>
    <link rel="stylesheet" href="../landingpage/styles.css">
    <link rel="stylesheet" href="mainpage-coach.css">
    <link rel="stylesheet" href="../shared/feed.css">
    <link rel="stylesheet" href="../shared/search.css">
    <link rel="stylesheet" href="../shared/mobile-overrides.css?v=2">
    <link rel="stylesheet" href="../shared/suggested-connections.css">
    <link rel="stylesheet" href="../shared/ios-app-overrides.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="../shared/capacitor-init.js"></script>
<script src="../shared/mobile-web-redirect.js"></script>
<script src="../shared/sw-register.js"></script>
</head>
<body class="dashboard-body profile-type-coach">
    <!-- Mobile Header (visible only on mobile) -->
    <header class="mobile-header" id="mobileHeader">
        <div class="mobile-header-left">
            <button class="mobile-avatar-circle" id="mobileProfilePic" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <div class="mobile-user-info">
                <div class="mobile-user-name" id="mobileUserName">User</div>
                <div class="mobile-user-role" id="mobileUserRole"></div>
            </div>
        </div>
        <div class="mobile-header-right">
            <img src="../assets/dr-logo.png" alt="Direct Recruit" class="mobile-header-logo">
        </div>
    </header>

    <!-- Mobile Sidebar Overlay -->
    <div class="mobile-sidebar-overlay" id="mobileSidebarOverlay"></div>

    <!-- Mobile Sidebar (Profile Menu) -->
    <aside class="mobile-sidebar" id="mobileSidebar">
        <a href="tabs/my-profile.html" class="mobile-sidebar-header" id="mobileSidebarProfileLink">
            <div class="mobile-sidebar-avatar-circle" id="mobileSidebarAvatar">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <div class="mobile-sidebar-user-info">
                <div class="mobile-sidebar-user-name" id="mobileSidebarUserName">User</div>
                <div class="mobile-sidebar-user-role" id="mobileSidebarUserRole"></div>
            </div>
        </a>
        <nav class="mobile-sidebar-nav">
            <a href="tabs/my-profile.html" class="mobile-sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>My Profile</span>
            </a>
            <a href="tabs/settings.html" class="mobile-sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Settings</span>
            </a>
            <div class="mobile-sidebar-divider"></div>
            <a href="#" class="mobile-sidebar-nav-item mobile-sidebar-stat-item" id="mobileProfileViewsLink">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span>Profile Views</span>
                <span class="mobile-stat-value" id="mobileProfileViewsCount">0</span>
            </a>
        </nav>
        <div class="mobile-sidebar-footer">
            <img src="../assets/dr-logo.png" alt="Direct Recruit" class="mobile-sidebar-logo">
            <button class="mobile-sidebar-logout-btn" id="mobileSidebarLogout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Mobile FAB (Floating Action Button) for New Post -->
    <button class="mobile-fab-post" id="mobileFabPost" aria-label="Create new post">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
    </button>

    <!-- Mobile Post Modal -->
    <div class="mobile-post-modal-overlay" id="mobilePostModal">
        <div class="mobile-post-modal-header">
            <button class="mobile-post-modal-close" id="mobilePostModalClose" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <span class="mobile-post-modal-title">Create Post</span>
            <button class="mobile-post-modal-submit" id="mobilePostModalSubmit">Post</button>
        </div>
        <div class="mobile-post-modal-body">
            <div class="mobile-post-modal-user">
                <div class="mobile-post-modal-avatar" id="mobilePostModalAvatar">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <span class="mobile-post-modal-username" id="mobilePostModalUsername">User</span>
            </div>
            <textarea class="mobile-post-modal-textarea" id="mobilePostModalTextarea" placeholder="Share an update, highlight, or achievement..." maxlength="300"></textarea>
            <span class="char-counter mobile-post-char-counter">0/300</span>
            <div class="mobile-post-modal-media-preview" id="mobilePostModalMediaPreview"></div>
        </div>
        <div class="mobile-post-modal-footer">
            <button class="mobile-post-modal-media-btn" id="mobilePostModalMediaBtn" title="Add Photo/Video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>
            <span class="mobile-media-counter" id="mobileMediaCounter">0/4</span>
        </div>
    </div>
    <!-- Hidden file input for mobile modal media uploads -->
    <input type="file" id="mobilePostMediaInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/mov,video/avi,video/webm" multiple style="display: none;">

    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Right Sidebar Toggle Button -->
    <button class="right-sidebar-toggle" id="rightSidebarToggle" aria-label="Toggle Right Sidebar">
        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="dashboard-container" id="dashboardContainer">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="../assets/dr-logo.png" alt="Direct Recruit Logo" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">Direct Recruit</span>
                        <span class="logo-subtitle">GET RECRUITED &middot; THE RIGHT WAY</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items injected by sidebar-nav.js -->
            </nav>

            <div class="sidebar-footer">
                <!-- Footer content injected by sidebar-footer.js -->
            </div>
        </aside>

        <!-- Main Feed Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>Feed</h1>
                <div id="searchComponent"></div>
            </div>

            <!-- Post Creation Box -->
            <div class="create-post-box">
                <div class="post-avatar-circle">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="post-input-container">
                    <textarea placeholder="Share recruiting updates, team news, or program highlights..." class="post-input" rows="3" maxlength="300"></textarea>
                    <span class="char-counter">0/300</span>
                    <!-- Media Preview Container -->
                    <div class="media-preview-container" id="mediaPreviewContainer" style="display: none;">
                        <div class="media-preview-grid" id="mediaPreviewGrid"></div>
                    </div>
                    <div class="post-actions">
                        <div class="post-options">
                            <button class="post-option-btn" id="addMediaBtn" title="Add Photo/Video">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </button>
                            <span class="media-counter" id="mediaCounter">0/4</span>
                        </div>
                        <button class="btn-post-submit">Post</button>
                    </div>
                </div>
            </div>
            <!-- Hidden file input for media uploads -->
            <input type="file" id="postMediaInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/mov,video/avi,video/webm" multiple style="display: none;">

            <!-- Feed Posts - Dynamically loaded by feed.js -->
            <div class="feed-posts" id="feedPosts">
                <!-- Posts will be loaded dynamically -->
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="right-sidebar" id="rightSidebar">
            <!-- Suggested Connections -->
            <div class="widget" id="suggestedConnectionsWidget">
                <h3 class="widget-title">Suggested Connections</h3>
                <div class="widget-content" id="suggestedConnectionsList">
                    <!-- Connections will be loaded dynamically -->
                </div>
                <button class="widget-show-more" id="showMoreConnections" style="display: none;">Show more</button>
            </div>
        </aside>

    <!-- Suggested Connections Modal -->
    <div class="connections-modal-overlay" id="connectionsModalOverlay">
        <div class="connections-modal">
            <div class="connections-modal-header">
                <h3>Suggested Connections</h3>
                <button class="connections-modal-close" id="connectionsModalClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="connections-modal-body" id="connectionsModalList">
                <!-- All connections will be loaded here -->
            </div>
        </div>
    </div>
    </div>

    <script src="../shared/api.js"></script>
    <script src="../shared/modal-utils.js"></script>
    <script src="../shared/school-search.js"></script>
    <script src="../shared/report-modal.js"></script>
    <script src="../shared/block-helpers.js"></script>
    <script src="../shared/mobile-header.js?v=4"></script>
    <script src="sidebar-nav.js"></script>
    <script src="sidebar-footer.js"></script>
    <script src="../shared/search.js"></script>
    <script src="../shared/native-camera.js"></script>
    <script src="../shared/feed.js"></script>
    <script src="../shared/suggested-connections.js"></script>
    <script src="mainpage-coach.js?v=999"></script>
    <script>
        // Initialize search component
        document.addEventListener('DOMContentLoaded', () => {
            new SearchComponent('searchComponent');
        });
    </script>
</body>
</html>
