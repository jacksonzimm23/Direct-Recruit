<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dashboard - Direct Recruit</title>
    <link rel="stylesheet" href="../landingpage/styles.css">
    <link rel="stylesheet" href="mainpage-coach.css">
    <link rel="stylesheet" href="../shared/feed.css">
    <link rel="stylesheet" href="../shared/search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Right Sidebar Toggle Button -->
    <button class="right-sidebar-toggle" id="rightSidebarToggle" aria-label="Toggle Right Sidebar">
        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="dashboard-container" id="dashboardContainer">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="https://res.cloudinary.com/dzmsj6nwv/image/upload/v1762928148/LogoPNG3_pofqrr.png" alt="Direct Recruit Logo" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">Direct Recruit</span>
                        <span class="logo-subtitle">GET RECRUITED · THE RIGHT WAY</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items injected by sidebar-nav.js -->
            </nav>

            <div class="sidebar-footer">
                <!-- Footer content injected by sidebar-footer.js -->
            </div>
        </aside>

        <!-- Main Feed Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>Feed</h1>
                <div id="searchComponent"></div>
            </div>

            <!-- Post Creation Box -->
            <div class="create-post-box">
                <div class="post-avatar-circle">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="post-input-container">
                    <textarea placeholder="Share recruiting updates, team news, or program highlights..." class="post-input" rows="3"></textarea>
                    <!-- Media Preview Container -->
                    <div class="media-preview-container" id="mediaPreviewContainer" style="display: none;">
                        <div class="media-preview-grid" id="mediaPreviewGrid"></div>
                    </div>
                    <div class="post-actions">
                        <div class="post-options">
                            <button class="post-option-btn" id="addMediaBtn" title="Add Photo/Video">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </button>
                        </div>
                        <button class="btn-post-submit">Post</button>
                    </div>
                </div>
            </div>
            <!-- Hidden file input for media uploads -->
            <input type="file" id="postMediaInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/mov,video/avi,video/webm" multiple style="display: none;">

            <!-- Feed Posts - Dynamically loaded by feed.js -->
            <div class="feed-posts" id="feedPosts">
                <!-- Posts will be loaded dynamically -->
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="right-sidebar" id="rightSidebar">
            <!-- Trending Topics -->
            <div class="widget">
                <div class="widget-title">Trending Topics</div>
                <div class="trending-list">
                    <div class="trending-item">
                        <div class="trending-info">
                            <div class="trending-topic">#Recruiting2026</div>
                            <div class="trending-count">1,247 posts</div>
                        </div>
                    </div>
                    <div class="trending-item">
                        <div class="trending-info">
                            <div class="trending-topic">#TransferPortal</div>
                            <div class="trending-count">892 posts</div>
                        </div>
                    </div>
                    <div class="trending-item">
                        <div class="trending-info">
                            <div class="trending-topic">#StateChampionship</div>
                            <div class="trending-count">654 posts</div>
                        </div>
                    </div>
                    <div class="trending-item">
                        <div class="trending-info">
                            <div class="trending-topic">#D1Football</div>
                            <div class="trending-count">523 posts</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Filters -->
            <div class="widget">
                <div class="widget-title">Quick Filters</div>
                <div class="filter-list">
                    <button class="filter-btn active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                        <span>All Posts</span>
                    </button>
                    <button class="filter-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Players Only</span>
                    </button>
                    <button class="filter-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Coaches Only</span>
                    </button>
                </div>
            </div>

            <!-- Recruiting Stats -->
            <div class="widget">
                <div class="widget-title">Your Recruiting Stats</div>
                <div class="stats-list">
                    <div class="stat-item-widget">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </div>
                        <div class="stat-details">
                            <div class="stat-value-lg">127</div>
                            <div class="stat-label-sm">Players Viewed</div>
                        </div>
                    </div>
                    <div class="stat-item-widget">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </div>
                        <div class="stat-details">
                            <div class="stat-value-lg">34</div>
                            <div class="stat-label-sm">Active Conversations</div>
                        </div>
                    </div>
                    <div class="stat-item-widget">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                            </svg>
                        </div>
                        <div class="stat-details">
                            <div class="stat-value-lg">18</div>
                            <div class="stat-label-sm">Shortlisted Players</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="../shared/api.js"></script>
    <script src="sidebar-nav.js"></script>
    <script src="sidebar-footer.js"></script>
    <script src="../shared/search.js"></script>
    <script src="../shared/feed.js"></script>
    <script src="mainpage-coach.js?v=999"></script>
    <script>
        // Initialize search component
        document.addEventListener('DOMContentLoaded', () => {
            new SearchComponent('searchComponent');
        });
    </script>
</body>
</html>
