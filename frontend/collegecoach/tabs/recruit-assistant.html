<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1128">
    <link rel="apple-touch-icon" href="../../icons/ios/180.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dzmsj6nwv/image/upload/v1770078659/LOGO.PNG_i0uvv4.png">
    <title>AI Recruiting Assistant - Direct Recruit</title>
    <link rel="stylesheet" href="../../landingpage/styles.css">
    <link rel="stylesheet" href="../mainpage-coach.css">
    <link rel="stylesheet" href="recruit-assistant.css">
    <link rel="stylesheet" href="../../shared/mobile-overrides.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="../../shared/sw-register.js"></script>
</head>
<body class="dashboard-body profile-type-coach">
    <!-- Mobile Header (visible only on mobile) -->
    <header class="mobile-header" id="mobileHeader">
        <div class="mobile-header-left">
            <a href="../mainpage-coach.html" class="ra-mobile-back" aria-label="Back to feed">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5"></path>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            <div class="mobile-user-info">
                <div class="mobile-user-name">AI Recruiting Assistant</div>
            </div>
        </div>
        <div class="mobile-header-right">
            <button class="ra-mobile-new-chat" id="mobileNewChatBtn" aria-label="New chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="dashboard-container no-right-sidebar" id="dashboardContainer">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="https://res.cloudinary.com/dzmsj6nwv/image/upload/v1770078659/LOGO.PNG_i0uvv4.png" alt="Direct Recruit Logo" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">Direct Recruit</span>
                        <span class="logo-subtitle">GET RECRUITED &middot; THE RIGHT WAY</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items injected by sidebar-nav.js -->
            </nav>

            <div class="sidebar-footer">
                <!-- Footer content injected by sidebar-footer.js -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content ra-content">
            <div class="ra-layout">
                <!-- Chat History Sidebar -->
                <div class="ra-history" id="raHistory">
                    <div class="ra-history-header">
                        <h2>Chat History</h2>
                        <button class="ra-new-chat-btn" id="newChatBtn" title="New Chat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="ra-history-list" id="raHistoryList">
                        <!-- Chat history items loaded dynamically -->
                    </div>
                    <div class="ra-history-footer">
                        <button class="ra-baselines-btn" id="openBaselinesBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 20V10"></path>
                                <path d="M18 20V4"></path>
                                <path d="M6 20v-4"></path>
                            </svg>
                            <span>Edit Baseline Metrics</span>
                        </button>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="ra-chat">
                    <div class="ra-messages" id="raMessages">
                        <!-- Welcome screen (shown when no messages) -->
                        <div class="ra-welcome" id="raWelcome">
                            <div class="ra-welcome-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                            <h2>AI Recruiting Assistant</h2>
                            <p>Describe the type of player you're looking for and I'll help you find them.</p>
                            <div class="ra-suggestions">
                                <button class="ra-suggestion" data-prompt="Find me a 6'2+ QB from Texas with a 3.5+ GPA">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <path d="m21 21-4.35-4.35"></path>
                                    </svg>
                                    Find me a 6'2+ QB from Texas with a 3.5+ GPA
                                </button>
                                <button class="ra-suggestion" data-prompt="Show me defensive backs from Florida, class of 2026">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <path d="m21 21-4.35-4.35"></path>
                                    </svg>
                                    Show me defensive backs from Florida, class of 2026
                                </button>
                                <button class="ra-suggestion" data-prompt="Find transfer portal WRs with at least 2 years of eligibility">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8"></circle>
                                        <path d="m21 21-4.35-4.35"></path>
                                    </svg>
                                    Find transfer portal WRs with 2+ years eligibility
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div class="ra-input-area">
                        <div class="ra-input-wrapper">
                            <textarea class="ra-input" id="raInput" placeholder="Describe the player you're looking for..." rows="1"></textarea>
                            <button class="ra-send-btn" id="raSendBtn" aria-label="Send">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Baseline Metrics Modal -->
    <div class="ra-baselines-overlay" id="raBaselinesOverlay">
        <div class="ra-baselines-modal" id="raBaselinesModal">
            <div class="ra-baselines-header">
                <h2>Baseline Metrics</h2>
                <button class="ra-baselines-close" id="closeBaselinesBtn" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="ra-baselines-body" id="raBaselinesBody">
                <!-- Division Display -->
                <div class="ra-baselines-division">
                    <label>Division</label>
                    <div class="ra-baselines-division-value" id="baselineDivision">Loading...</div>
                </div>

                <!-- Min GPA Slider -->
                <div class="ra-baselines-gpa">
                    <div class="ra-baselines-gpa-header">
                        <label>Minimum GPA</label>
                        <span class="ra-baselines-gpa-value" id="baselineGpaValue">2.5</span>
                    </div>
                    <input type="range" class="ra-baselines-slider" id="baselineGpaSlider" min="0" max="40" value="25" step="1">
                    <div class="ra-baselines-slider-labels">
                        <span>0.0</span>
                        <span>2.0</span>
                        <span>4.0</span>
                    </div>
                </div>

                <div class="ra-baselines-divider"></div>

                <!-- Position Baselines -->
                <div class="ra-baselines-positions" id="raBaselinesPositions">
                    <!-- Generated by JS -->
                </div>
            </div>
            <div class="ra-baselines-footer">
                <button class="ra-baselines-reset" id="resetBaselinesBtn">Reset to Defaults</button>
                <button class="ra-baselines-save" id="saveBaselinesBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="../../shared/api.js"></script>
    <script src="../../shared/mobile-header.js?v=4"></script>
    <script src="../sidebar-nav.js"></script>
    <script src="../sidebar-footer.js"></script>
    <script src="../mainpage-coach.js?v=4"></script>
    <script src="recruit-assistant-glossary.js"></script>
    <script src="recruit-assistant.js"></script>
</body>
</html>
