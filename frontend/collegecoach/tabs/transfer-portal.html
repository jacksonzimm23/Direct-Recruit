<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Portal - Direct Recruit</title>
    <link rel="stylesheet" href="../../landingpage/styles.css">
    <link rel="stylesheet" href="../mainpage-coach.css">
    <link rel="stylesheet" href="transfer-portal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="dashboard-container" id="dashboardContainer">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="https://res.cloudinary.com/dzmsj6nwv/image/upload/v1762928148/LogoPNG3_pofqrr.png" alt="Direct Recruit Logo" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">Direct Recruit</span>
                        <span class="logo-subtitle">GET RECRUITED · THE RIGHT WAY</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items injected by sidebar-nav.js -->
            </nav>

            <div class="sidebar-footer">
                <!-- Footer content injected by sidebar-footer.js -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>Transfer Portal</h1>
            </div>

            <!-- Advanced Filters Section -->
            <div class="filters-container">
                <div class="filters-header">
                    <h2>Filter Players</h2>
                    <button class="btn-reset-filters" id="resetFilters">Reset All</button>
                </div>

                <div class="filters-grid">
                    <!-- Position Filter -->
                    <div class="filter-group">
                        <label>Position</label>
                        <select class="filter-select" id="positionFilter">
                            <option value="">All Positions</option>
                            <optgroup label="Offense">
                                <option value="QB">Quarterback (QB)</option>
                                <option value="RB">Running Back (RB)</option>
                                <option value="FB">Fullback (FB)</option>
                                <option value="WR">Wide Receiver (WR)</option>
                                <option value="TE">Tight End (TE)</option>
                                <option value="OT">Offensive Tackle (OT)</option>
                                <option value="OG">Offensive Guard (OG)</option>
                                <option value="C">Center (C)</option>
                            </optgroup>
                            <optgroup label="Defense">
                                <option value="DE">Defensive End (DE)</option>
                                <option value="DT">Defensive Tackle (DT)</option>
                                <option value="NT">Nose Tackle (NT)</option>
                                <option value="OLB">Outside Linebacker (OLB)</option>
                                <option value="MLB">Middle Linebacker (MLB)</option>
                                <option value="ILB">Inside Linebacker (ILB)</option>
                                <option value="CB">Cornerback (CB)</option>
                                <option value="FS">Free Safety (FS)</option>
                                <option value="SS">Strong Safety (SS)</option>
                            </optgroup>
                            <optgroup label="Special Teams">
                                <option value="K">Kicker (K)</option>
                                <option value="P">Punter (P)</option>
                                <option value="LS">Long Snapper (LS)</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- Years of Eligibility Filter -->
                    <div class="filter-group">
                        <label>Years of Eligibility</label>
                        <select class="filter-select" id="eligibilityFilter">
                            <option value="">All Years</option>
                            <option value="4">4 Years</option>
                            <option value="3">3 Years</option>
                            <option value="2">2 Years</option>
                            <option value="1">1 Year</option>
                        </select>
                    </div>

                    <!-- Previous Level Filter -->
                    <div class="filter-group">
                        <label>Previous Level</label>
                        <select class="filter-select" id="levelFilter">
                            <option value="">All Levels</option>
                            <option value="FBS">FBS</option>
                            <option value="FCS">FCS</option>
                            <option value="D2">Division II</option>
                            <option value="D3">Division III</option>
                            <option value="NAIA">NAIA</option>
                            <option value="JUCO">Junior College</option>
                        </select>
                    </div>

                    <!-- Height Slider -->
                    <div class="filter-group slider-group">
                        <label>Height</label>
                        <div class="slider-values">
                            <span id="heightMin">5'0"</span>
                            <span id="heightMax">7'0"</span>
                        </div>
                        <input type="range" class="filter-slider" id="heightSlider" min="60" max="84" value="60" step="1">
                        <div class="slider-label">Minimum: <span id="heightValue">5'0"</span></div>
                    </div>

                    <!-- Weight Slider -->
                    <div class="filter-group slider-group">
                        <label>Weight (lbs)</label>
                        <div class="slider-values">
                            <span id="weightMin">150</span>
                            <span id="weightMax">350</span>
                        </div>
                        <input type="range" class="filter-slider" id="weightSlider" min="150" max="350" value="150" step="5">
                        <div class="slider-label">Minimum: <span id="weightValue">150</span> lbs</div>
                    </div>

                    <!-- GPA Slider -->
                    <div class="filter-group slider-group">
                        <label>GPA</label>
                        <div class="slider-values">
                            <span id="gpaMin">0.0</span>
                            <span id="gpaMax">4.0</span>
                        </div>
                        <input type="range" class="filter-slider" id="gpaSlider" min="0" max="40" value="0" step="1">
                        <div class="slider-label">Minimum: <span id="gpaValue">0.0</span></div>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="btn-apply-filters" id="applyFilters">Apply Filters</button>
                    <div class="results-count">Showing <span id="resultsCount">9</span> players</div>
                </div>
            </div>

            <!-- Players Grid -->
            <div class="players-grid" id="playersGrid">
                <!-- Loading State -->
                <div class="loading-state" id="loadingState">
                    <div class="loading-spinner"></div>
                    <p>Loading transfer players...</p>
                </div>
                <!-- Empty State -->
                <div class="empty-state" id="emptyState" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 12h8"></path>
                        <path d="M12 8v8"></path>
                    </svg>
                    <h3>No transfer players found</h3>
                    <p>Try adjusting your filters to see more results.</p>
                </div>
                <!-- Player cards will be dynamically inserted here -->
            </div>

            <!-- Load More Button -->
            <div class="load-more-container" id="loadMoreContainer" style="display: none;">
                <button class="btn-load-more" id="loadMorePlayersBtn">See More Players</button>
            </div>
        </main>
    </div>

    <script src="../../shared/api.js"></script>
    <script src="../sidebar-nav.js"></script>
    <script src="../sidebar-footer.js"></script>
    <script src="../mainpage-coach.js?v=4"></script>
    <script src="transfer-portal.js"></script>
</body>
</html>
