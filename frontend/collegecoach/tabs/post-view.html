    <style>
        /* Match feed page layout - no extra max-width constraint */
        .post-view-container {
            padding: 0;
        }

        .post-view-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(18, 130, 162, 0.2);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            color: var(--cerulean);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(18, 130, 162, 0.1);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .post-view-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--white);
        }

        /* Match feed page post card styling exactly */
        .post-view-content {
            overflow: hidden;
        }

        .post-view-content .post-card {
            cursor: default;
            transform: none !important;
        }

        .post-view-content .post-card:hover {
            transform: none !important;
        }

        /* Hide the arrow icon on single post view */
        .post-view-content .post-view-icon {
            display: none;
        }

        /* Disable click navigation on post content */
        .post-view-content .post-content {
            cursor: default;
        }

        /* Hide feed tabs on single post view */
        .post-view-content .feed-tabs {
            display: none !important;
        }

        /* Use feed.css defaults for post content and media - no overrides needed */

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: rgba(254, 252, 251, 0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(18, 130, 162, 0.2);
            border-top-color: var(--cerulean);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 3rem;
            color: rgba(254, 252, 251, 0.6);
        }

        .error-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Comments section always visible on post view */
        .post-view-content .post-comments-section {
            display: block !important;
            border-top: 1px solid rgba(18, 130, 162, 0.2);
            padding: 1.5rem;
        }

        /* Better spacing for comments */
        .post-view-content .post-stats {
            padding: 0.75rem 0;
        }

        .post-view-content .post-actions-bar {
            padding: 0.75rem 0;
            border-top: 1px solid rgba(18, 130, 162, 0.15);
            border-bottom: 1px solid rgba(18, 130, 162, 0.15);
            margin: 0.5rem 0;
        }

        /* Responsive adjustments - let feed.css and mobile-overrides.css handle most styling */
        @media (max-width: 768px) {
            .post-view-header {
                padding: 0.75rem 0;
            }
        }
    </style>
</head>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const shareId = urlParams.get('share'); // For quote/repost posts
        const referrer = urlParams.get('ref') || 'feed';

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else if (referrer === 'profile') {
                window.location.href = 'my-profile.html';
            } else {
                window.location.href = '../mainpage-coach.html';
            }
        }

        function highlightSidebarNav() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            let targetHref = '';
            if (referrer === 'profile') {
                targetHref = 'my-profile.html';
            } else {
                targetHref = '../mainpage-coach.html';
            }

            document.querySelectorAll('.nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (href && (href.includes(targetHref) || (referrer === 'feed' && href.includes('mainpage')))) {
                    item.classList.add('active');
                }
            });
        }

        async function loadPost() {
            const container = document.getElementById('postViewContent');

            if (!postId && !shareId) {
                container.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Post not found</p>
                    </div>
                `;
                return;
            }

            try {
                let postElement;
                let targetPostId = postId;

                if (typeof FeedManager !== 'undefined') {
                    // Pass true to skip init - we only want to use helper methods, not load the full feed
                    feedManager = new FeedManager(true);
                    feedManager.feedContainer = container;

                    await feedManager.loadCurrentUser();

                    if (shareId) {
                        // Fetch the share (quote/repost) by share ID
                        const response = await API.get(`/posts/share/${shareId}`);
                        const share = response.share;

                        if (!share) {
                            throw new Error('Share not found');
                        }

                        targetPostId = share.original_post_id;

                        // Check if it's a quote post
                        if (share.is_quote) {
                            postElement = feedManager.createSingleQuotePostElement(share);
                        } else {
                            // Regular repost - render original post
                            postElement = feedManager.createPostElement(share);
                        }
                    } else {
                        // Regular post by ID
                        const response = await API.get(`/posts/${postId}`);

                        if (!response.post) {
                            throw new Error('Post not found');
                        }

                        postElement = feedManager.createPostElement(response.post);
                    }

                    container.innerHTML = '';
                    container.appendChild(postElement);

                    const commentsSection = postElement.querySelector('.post-comments-section');
                    if (commentsSection) {
                        commentsSection.style.display = 'block';
                        feedManager.loadComments(targetPostId);
                    }
                } else {
                    throw new Error('Feed manager not available');
                }
            } catch (error) {
                console.error('Error loading post:', error);
                container.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Failed to load post</p>
                        <button class="back-btn" onclick="goBack()" style="margin-top: 1rem;">Go Back</button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            highlightSidebarNav();
            loadPost();
        });
    </script>
