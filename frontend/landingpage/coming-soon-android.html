<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        .coming-soon-pill {
            display: inline-block;
            background: rgba(255, 107, 53, 0.15);
            color: #ff6b35;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            margin-bottom: 20px;
        }
        .get-app-secondary {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
        }
        .get-app-secondary a {
            color: #1282a2;
            text-decoration: none;
            font-weight: 600;
        }
        .get-app-secondary a:hover {
            text-decoration: underline;
        }

<body class="v2-splash-body">
    <!-- Splash -->
    <main class="v2-splash">
        <div class="v2-splash-inner">
            <!-- Left: Logo + Brand -->

                <div class="v2-brand-lockup">
                    <img src="../assets/dr-logo.png" alt="Direct Recruit" class="v2-splash-logo">

            <!-- Right: Coming Soon -->

                <span class="coming-soon-pill">Coming Soon</span>

                <p class="v2-splash-roles">For now, Direct Recruit is available on iOS and on desktop.</p>
            </div>
        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="v2-splash-footer">
        <div class="v2-splash-footer-inner">
            <a href="support.html">Support</a>
            <a href="privacy-policy.html">Privacy</a>
            <a href="terms-of-service.html">Terms</a>
