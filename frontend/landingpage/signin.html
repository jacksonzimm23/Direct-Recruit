<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1128">
    <link rel="apple-touch-icon" href="../icons/ios/180.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/dr-logo.png">
    <title>Sign In - Direct Recruit</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="../shared/ios-app-overrides.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="../shared/capacitor-init.js"></script>
<script src="../shared/mobile-web-redirect.js"></script>
<script src="../shared/sw-register.js"></script>
</head>
<body>

    <!-- Sign In Section -->
    <section class="signin-section">
        <div class="signin-container">
            <div class="signin-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your Direct Recruit account</p>
            </div>

            <div class="signin-card">
                <form class="signin-form" id="signinForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <!-- No "Remember me": every session persists until the user signs
                         out, so the checkbox had nothing left to control. -->
                    <div class="form-options">
                        <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                    </div>

                    <p class="error-message" id="loginError"></p>

                    <button type="submit" class="btn-signin">
                        Sign In
                        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                        </svg>
                    </button>

                    <p class="signin-terms-notice">
                        By clicking Sign In, you agree to our
                        <a href="terms-of-service.html">Terms of Service</a> and
                        <a href="privacy-policy.html">Privacy Policy</a>.
                    </p>
                </form>

                <p class="signin-footer">
                    Don't have an account? <a href="get-started.html">Sign Up</a>
                </p>
            </div>
        </div>
    </section>

    <script src="../shared/api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
