<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Direct Recruit</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="signin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="https://res.cloudinary.com/dzmsj6nwv/image/upload/v1762928148/LogoPNG3_pofqrr.png" alt="Direct Recruit Logo" class="logo-icon">
                <div class="logo-text">
                    <span class="logo-title">Direct Recruit</span>
                    <span class="logo-subtitle">GET RECRUITED · THE RIGHT WAY</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="index.html#features">Features</a>
                <a href="index.html#how-it-works">How It Works</a>
                <a href="about.html">About</a>
            </div>
            <div class="nav-buttons">
                <a href="signin.html"><button class="btn-secondary">Sign In</button></a>
                <a href="get-started.html"><button class="btn-primary">Get Started</button></a>
            </div>
        </div>
    </nav>

    <!-- Forgot Password Section -->
    <section class="signin-section">
        <div class="signin-container">
            <div class="signin-header">
                <h1>Reset Password</h1>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

            <div class="signin-card">
                <form class="signin-form" id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-signin">
                        Send Reset Link
                        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                        </svg>
                    </button>
                </form>

                <p class="signin-footer">
                    Remember your password? <a href="signin.html">Sign In</a>
                </p>
            </div>
        </div>
    </section>

    <script src="forgot-password.js"></script>
</body>
</html>
