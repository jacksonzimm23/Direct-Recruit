<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1128">
    <link rel="apple-touch-icon" href="../../icons/ios/180.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/png" href="../../assets/dr-logo.png">
    <title>Discover Players - Direct Recruit</title>
    <link rel="stylesheet" href="../../landingpage/styles.css">
    <link rel="stylesheet" href="../mainpage-player.css">
    <link rel="stylesheet" href="discover-players.css">
    <link rel="stylesheet" href="../../shared/mobile-overrides.css?v=2">
    <link rel="stylesheet" href="../../shared/ios-app-overrides.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="../../shared/capacitor-init.js"></script>
<script src="../../shared/mobile-web-redirect.js"></script>
<script src="../../shared/sw-register.js"></script>
</head>
<body class="dashboard-body profile-type-transfer">
    <!-- Mobile Header (visible only on mobile) -->
    <header class="mobile-header" id="mobileHeader">
        <div class="mobile-header-left">
            <button class="mobile-avatar-circle" id="mobileProfilePic" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <div class="mobile-user-info">
                <div class="mobile-user-name" id="mobileUserName">User</div>
                <div class="mobile-user-role" id="mobileUserRole"></div>
            </div>
        </div>
        <div class="mobile-header-right">
            <img src="../../assets/dr-logo.png" alt="Direct Recruit" class="mobile-header-logo">
        </div>
    </header>

    <!-- Mobile Sidebar Overlay -->
    <div class="mobile-sidebar-overlay" id="mobileSidebarOverlay"></div>

    <!-- Mobile Sidebar (Profile Menu) -->
    <aside class="mobile-sidebar" id="mobileSidebar">
        <a href="my-profile.html" class="mobile-sidebar-header" id="mobileSidebarProfileLink">
            <div class="mobile-sidebar-avatar-circle" id="mobileSidebarAvatar">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <div class="mobile-sidebar-user-info">
                <div class="mobile-sidebar-user-name" id="mobileSidebarUserName">User</div>
                <div class="mobile-sidebar-user-role" id="mobileSidebarUserRole"></div>
            </div>
        </a>
        <nav class="mobile-sidebar-nav">
            <a href="my-profile.html" class="mobile-sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>My Profile</span>
            </a>
            <a href="settings.html" class="mobile-sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Settings</span>
            </a>
            <div class="mobile-sidebar-divider"></div>
            <a href="#" class="mobile-sidebar-nav-item mobile-sidebar-stat-item" id="mobileProfileViewsLink">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span>Profile Views</span>
                <span class="mobile-stat-value" id="mobileProfileViewsCount">0</span>
            </a>
        </nav>
        <div class="mobile-sidebar-footer">
            <img src="../../assets/dr-logo.png" alt="Direct Recruit" class="mobile-sidebar-logo">
            <button class="mobile-sidebar-logout-btn" id="mobileSidebarLogout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
        <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <!-- Main Container -->
    <div class="dashboard-container" id="dashboardContainer">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="../../assets/dr-logo.png" alt="Direct Recruit Logo" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">Direct Recruit</span>
                        <span class="logo-subtitle">GET RECRUITED &middot; THE RIGHT WAY</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items injected by sidebar-nav.js -->
            </nav>

            <div class="sidebar-footer">
                <!-- Footer content injected by sidebar-footer.js -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1>Discover</h1>
            </div>

            <!-- Find Coaches Section -->
            <div class="discover-section">
                <!-- Mobile Filter Button (hidden on desktop) -->
                <button class="mobile-filter-btn" id="mobileFilterBtn" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    <span>Filters</span>
                    <span class="filter-count-badge" id="filterCountBadge" style="display: none;">0</span>
                </button>

                <!-- Coach Filters -->
                <div class="filters-section">
                    <div class="filter-group">
                        <label>State</label>
                        <select class="filter-select" id="coachStateFilter">
                            <option value="">All States</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="MI">Michigan</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="OH">Ohio</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="TX">Texas</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Division</label>
                        <select class="filter-select" id="divisionFilter">
                            <option value="">All Divisions</option>
                            <option value="D1 FBS">D1 FBS</option>
                            <option value="D1 FCS">D1 FCS</option>
                            <option value="D2">Division II</option>
                            <option value="D3">Division III</option>
                            <option value="NAIA">NAIA</option>
                            <option value="JUCO">Junior College</option>
                        </select>
                    </div>

                    <button class="btn-reset-filters" id="resetCoachFilters">Reset Filters</button>
                </div>

                <!-- Coaches Grid -->
                <div class="coaches-grid" id="coachesGrid">
                    <!-- Coach cards will be loaded dynamically -->
                </div>

                <!-- Load More Button -->
                <div class="load-more-container">
                    <button class="btn-load-more" id="loadMoreCoachesBtn">Load More Coaches</button>
                </div>
            </div>

            <!-- Connect with Players Section -->
            <div class="discover-section">
                <div class="section-title-row">
                    <h2 class="section-title-sub">Connect with Players</h2>
                    <span class="section-bullet">•</span>
                    <p class="section-subtitle">Network with other athletes and build connections</p>
                </div>

                <!-- Players Grid -->
                <div class="players-grid" id="playersGrid">
                    <!-- Player cards will be loaded dynamically -->
                </div>

                <!-- Load More Button -->
                <div class="load-more-container">
                    <button class="btn-load-more" id="loadMorePlayersBtn">Load More Players</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Filter Modal Overlay -->
    <div class="mobile-filter-overlay" id="mobileFilterOverlay"></div>

    <!-- Mobile Filter Modal -->
    <div class="mobile-filter-modal" id="mobileFilterModal">
        <div class="mobile-filter-modal-header">
            <h3>Filter Coaches</h3>
            <button class="mobile-filter-close" id="mobileFilterClose" aria-label="Close filters">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="mobile-filter-modal-body">
            <div class="mobile-filter-group">
                <label>State</label>
                <select id="mobileCoachStateFilter">
                    <option value="">All States</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                    <option value="FL">Florida</option>
                    <option value="GA">Georgia</option>
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="MI">Michigan</option>
                    <option value="NY">New York</option>
                    <option value="NC">North Carolina</option>
                    <option value="OH">Ohio</option>
                    <option value="PA">Pennsylvania</option>
                    <option value="TX">Texas</option>
                </select>
            </div>
            <div class="mobile-filter-group">
                <label>Division</label>
                <select id="mobileDivisionFilter">
                    <option value="">All Divisions</option>
                    <option value="D1 FBS">D1 FBS</option>
                    <option value="D1 FCS">D1 FCS</option>
                    <option value="D2">Division II</option>
                    <option value="D3">Division III</option>
                    <option value="NAIA">NAIA</option>
                    <option value="JUCO">Junior College</option>
                </select>
            </div>
        </div>
        <div class="mobile-filter-modal-footer">
            <button class="mobile-filter-reset" id="mobileFilterReset">Reset</button>
            <button class="mobile-filter-apply" id="mobileFilterApply">Apply Filters</button>
        </div>
    </div>

    <script src="../../shared/api.js"></script>
    <script src="../../shared/modal-utils.js"></script>
    <script src="../../shared/school-search.js"></script>
    <script src="../../shared/mobile-header.js?v=4"></script>
    <script src="../sidebar-nav.js"></script>
    <script src="../sidebar-footer.js"></script>
    <script src="../mainpage-player.js"></script>
    <script src="discover-players.js"></script>
</body>
</html>
