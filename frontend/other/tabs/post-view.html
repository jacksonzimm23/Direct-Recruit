<head>

    <style>
        .post-view-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        .post-view-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(18, 130, 162, 0.2);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            color: var(--cerulean);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(18, 130, 162, 0.1);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .post-view-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--white);
        }

        .post-view-content {
            background: rgba(254, 252, 251, 0.03);
            border: 1px solid rgba(18, 130, 162, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }

        .post-view-content .post-card {
            border: none;
            border-radius: 0;
            margin: 0;
            padding: 1.5rem;
            cursor: default;
            transform: none !important;
        }

        .post-view-content .post-card:hover {
            background: rgba(254, 252, 251, 0.03);
            border-color: transparent;
            transform: none !important;
        }

        /* Hide the arrow icon on single post view */
        .post-view-content .post-view-icon {
            display: none;
        }

        /* Disable click navigation on post content */
        .post-view-content .post-content {
            cursor: default;
        }

        /* Hide feed tabs on single post view */
        .post-view-content .feed-tabs {
            display: none !important;
        }

        /* Larger post content on single post view */
        .post-view-content .post-content p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Larger media on single post view */
        .post-view-content .post-media img,
        .post-view-content .post-media video {
            max-height: 600px;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: rgba(254, 252, 251, 0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(18, 130, 162, 0.2);
            border-top-color: var(--cerulean);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 3rem;
            color: rgba(254, 252, 251, 0.6);
        }

        .error-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Comments section always visible on post view */
        .post-view-content .post-comments-section {
            display: block !important;
            border-top: 1px solid rgba(18, 130, 162, 0.2);
            padding: 1.5rem;
        }

        /* Better spacing for comments */
        .post-view-content .post-stats {
            padding: 0.75rem 0;
        }

        .post-view-content .post-actions-bar {
            padding: 0.75rem 0;
            border-top: 1px solid rgba(18, 130, 162, 0.15);
            border-bottom: 1px solid rgba(18, 130, 162, 0.15);
            margin: 0.5rem 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .post-view-container {
                padding: 1rem;
            }

            .post-view-content .post-card {
                padding: 1rem;
            }

            .post-view-content .post-media img,
            .post-view-content .post-media video {
                max-height: 400px;
            }
        }
    </style>
</head>

    <script>
        // Get post ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const referrer = urlParams.get('ref') || 'feed';

        function goBack() {
            // Try to go back in history, or redirect based on referrer
            if (window.history.length > 1) {
                window.history.back();
            } else if (referrer === 'profile') {
                window.location.href = 'my-profile.html';
            } else {
                window.location.href = '../mainpage-other.html';
            }
        }

        // Highlight the correct sidebar nav item based on referrer
        function highlightSidebarNav() {
            // Remove active class from all nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Highlight based on referrer
            let targetHref = '';
            if (referrer === 'profile') {
                targetHref = 'my-profile.html';
            } else {
                targetHref = '../mainpage-other.html';
            }

            // Find and highlight the matching nav item
            document.querySelectorAll('.nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (href && (href.includes(targetHref) || (referrer === 'feed' && href.includes('mainpage')))) {
                    item.classList.add('active');
                }
            });
        }

        async function loadPost() {
            const container = document.getElementById('postViewContent');

            if (!postId) {
                container.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Post not found</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await API.get(`/posts/${postId}`);

                if (!response.post) {
                    throw new Error('Post not found');
                }

                // Create a minimal feed manager for rendering single post
                if (typeof FeedManager !== 'undefined') {
                    // Create feedManager with skipInit flag to prevent automatic feed loading
                    feedManager = new FeedManager(true); // Pass true to skip init
                    feedManager.feedContainer = container;

                    // Manually load current user for authentication context
                    await feedManager.loadCurrentUser();

                    // Render ONLY the single post
                    const postElement = feedManager.createPostElement(response.post);
                    container.innerHTML = ''; // Clear any existing content
                    container.appendChild(postElement);

                    // Remove click navigation from post content since we're already on the single post view
                    const postContent = postElement.querySelector('.post-content');
                    if (postContent) {
                        postContent.style.cursor = 'default';
                        postContent.style.pointerEvents = 'none';
                        // Re-enable pointer events for interactive elements inside
                        const mediaElements = postContent.querySelectorAll('.post-media, img, video');
                        mediaElements.forEach(el => {
                            el.style.pointerEvents = 'auto';
                        });
                    }

                    // Remove the post card click functionality
                    postElement.style.cursor = 'default';

                    // Hide the arrow icon
                    const viewIcon = postElement.querySelector('.post-view-icon');
                    if (viewIcon) {
                        viewIcon.style.display = 'none';
                    }

                    // Auto-expand comments section
                    const commentsSection = postElement.querySelector('.post-comments-section');
                    if (commentsSection) {
                        commentsSection.style.display = 'block';
                        // Load comments
                        feedManager.loadComments(postId);
                    }
                } else {
                    throw new Error('Feed manager not available');
                }
            } catch (error) {
                console.error('Error loading post:', error);
                container.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Failed to load post</p>
                        <button class="back-btn" onclick="goBack()" style="margin-top: 1rem;">Go Back</button>
                    </div>
                `;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            highlightSidebarNav();
            loadPost();
        });
    </script>
