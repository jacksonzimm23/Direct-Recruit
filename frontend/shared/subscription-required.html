<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1128">
    <link rel="icon" type="image/png" href="../assets/dr-logo.png">
    <title>Subscription Required - Direct Recruit</title>
    <link rel="stylesheet" href="../landingpage/styles.css">
    <link rel="stylesheet" href="ios-app-overrides.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .paywall-section { display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 70px);padding:40px 20px; }
        .paywall-container { text-align:center;max-width:520px; }
        .paywall-icon { width:64px;height:64px;margin:0 auto 24px;color:#ff6b35; }
        .paywall-title { color:#fff;font-size:24px;font-weight:700;margin:0 0 12px; }
        .paywall-message { color:rgba(255,255,255,0.55);font-size:15px;line-height:1.7;margin:0 0 32px; }
        .paywall-actions { display:flex;flex-direction:column;gap:12px;max-width:320px;margin:0 auto; }
        .paywall-btn { display:flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all 0.2s; }
        .paywall-btn-primary { background:#1282a2;color:#fff; }
        .paywall-btn-primary:hover { background:#0f6f8c; }
        .paywall-btn-secondary { background:rgba(255,255,255,0.05);color:#ccd6f6;border:1px solid rgba(100,116,152,0.3); }
        .paywall-btn-secondary:hover { background:rgba(255,255,255,0.1); }
        .paywall-btn-ghost { background:none;color:#8892b0;border:none;font-size:13px; }
        .paywall-btn-ghost:hover { color:#ccd6f6; }
    </style>
    <script src="capacitor-init.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../landingpage/index.html" class="logo">
                <img src="../assets/dr-logo.png" alt="Direct Recruit Logo" class="logo-icon">
                <div class="logo-text">
                    <span class="logo-title">Direct Recruit</span>
                    <span class="logo-subtitle">GET RECRUITED &middot; THE RIGHT WAY</span>
                </div>
            </a>
        </div>
    </nav>

    <section class="paywall-section">
        <div class="paywall-container">
            <div class="paywall-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1 class="paywall-title">Subscription Required</h1>
            <p class="paywall-message">Your profile type requires an active subscription to access Direct Recruit. Subscribe to unlock full platform access, or switch to a free profile type.</p>
            <div class="paywall-actions">
                <button class="paywall-btn paywall-btn-primary" id="paywallSubscribeBtn">Subscribe Now</button>
                <button class="paywall-btn paywall-btn-secondary" id="paywallSwitchBtn">Switch Profile Type</button>
                <button class="paywall-btn paywall-btn-ghost" id="paywallLogoutBtn">Log Out</button>
            </div>
        </div>
    </section>

    <script src="../shared/api.js"></script>
    <script src="iap-products.js"></script>
    <script>
    (async function() {
        const PAID_FOLDERS = ['hsplayer', 'transferplayer', 'collegecoach'];

        try {
            const me = await API.auth.getCurrentUser();
            if (!me || !me.user) {
                window.location.href = '../landingpage/signin.html';
                return;
            }

            // lesson 69: getProfileFolder needs college_division from me.profile —
            // me.user alone returns the wrong folder for college coaches/players.
            const folder = getProfileFolder({
                role: me.user.role,
                is_transfer_player: me.user.is_transfer_player,
                college_division: me.profile && me.profile.college_division
            });

            // Phase 3c: shared handler — branches to IAP on iOS, Stripe on web.
            // profileType: 'hsplayer'|'transferplayer'|'collegecoach'; tier: null for players, 'starter'|'pro'|'elite' for coaches
            async function handleSubscribeClick(profileType, tier, onError) {
                if (API.isIOSApp()) {
                    try {
                        const r = await window.IAP.purchaseTier(profileType, tier);
                        if (r.success) {
                            localStorage.setItem('iap_pending_activation', JSON.stringify({
                                at: Date.now(),
                                userId: me.user.id
                            }));
                            // Reload the paywall page; the IIFE honors the grace key
                            // and falls through to the user's mainpage.
                            window.location.reload();
                            return;
                        }
                        if (r.cancelled) { onError && onError(null); return; }
                        onError && onError(r.error || 'Purchase failed');
                    } catch (e) {
                        onError && onError(e.message || 'Purchase failed');
                    }
                    return;
                }

                // Web — existing Stripe flow
                const redirectUrl = '/frontend/' + (profileType === 'collegecoach'
                    ? 'collegecoach/mainpage-coach.html'
                    : profileType + '/' + (profileType.includes('coach') ? 'mainpage-coach.html' : 'mainpage-player.html'));
                const { url } = await API.payments.createCheckoutSession(
                    profileType, tier, 'resubscribe',
                    window.location.origin + '/frontend/shared/payment-success-switch.html',
                    window.location.href
                );
                localStorage.setItem('switchRedirectUrl', redirectUrl);
                window.location.href = url;
            }

            // Subscribe button
            document.getElementById('paywallSubscribeBtn').addEventListener('click', async () => {
                const btn = document.getElementById('paywallSubscribeBtn');
                const originalText = btn.textContent;
                btn.textContent = 'Redirecting...';
                btn.disabled = true;

                try {
                    if (folder === 'collegecoach') {
                        // Show tier selection inline
                        showTierSelection();
                        // Restore button state (showTierSelection replaces content anyway on web path)
                        btn.textContent = originalText;
                        btn.disabled = false;
                    } else {
                        const profileType = folder === 'transferplayer' ? 'transferplayer' : 'hsplayer';
                        await handleSubscribeClick(profileType, null, (err) => {
                            if (err) showToast('Failed to start checkout: ' + err, 'error');
                            btn.textContent = originalText;
                            btn.disabled = false;
                        });
                    }
                } catch (e) {
                    showToast('Failed to start checkout: ' + e.message, 'error');
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            });

            // Switch profile button
            document.getElementById('paywallSwitchBtn').addEventListener('click', () => {
                window.location.href = '/frontend/' + folder + '/tabs/settings.html';
            });

            // Logout button
            document.getElementById('paywallLogoutBtn').addEventListener('click', async () => {
                await API.auth.logout();
            });

            async function showTierSelection() {
                const container = document.querySelector('.paywall-actions');
                container.innerHTML = '<p style="color:#8892b0;font-size:14px;margin:0 0 16px;">Select your plan:</p>';

                // Apple Guideline 3.1.1: prefer Apple's localized price on iOS,
                // fall back to hardcoded USD on web or if offerings fetch fails.
                let livePrices = {};
                if (window.API?.isIOSApp && window.API.isIOSApp() && window.IAP?.getOfferingsPriceMap) {
                    try { livePrices = await window.IAP.getOfferingsPriceMap(); } catch (_) {}
                }

                const tiers = [
                    { name: 'Starter', price: '20', tier: 'starter', priceKey: 'coach_starter' },
                    { name: 'Pro', price: '50', tier: 'pro', priceKey: 'coach_pro' },
                    { name: 'Elite', price: '100', tier: 'elite', priceKey: 'coach_elite' }
                ];
                tiers.forEach(t => {
                    const btn = document.createElement('button');
                    btn.className = 'paywall-btn ' + (t.tier === 'pro' ? 'paywall-btn-primary' : 'paywall-btn-secondary');
                    const livePrice = livePrices[t.priceKey];
                    btn.textContent = livePrice
                        ? (t.name + ' — ' + livePrice)
                        : (t.name + ' — $' + t.price + '/mo');
                    btn.addEventListener('click', async () => {
                        const originalText = btn.textContent;
                        btn.textContent = 'Redirecting...';
                        btn.disabled = true;
                        await handleSubscribeClick('collegecoach', t.tier, (err) => {
                            if (err) showToast('Failed: ' + err, 'error');
                            btn.textContent = originalText;
                            btn.disabled = false;
                        });
                    });
                    container.appendChild(btn);
                });
            }

        } catch (e) {
            console.error('Paywall init error:', e);
        }
    })();
    </script>
</body>
</html>
