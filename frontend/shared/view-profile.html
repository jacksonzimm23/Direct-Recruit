<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1128">
    <link rel="apple-touch-icon" href="../icons/ios/180.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dzmsj6nwv/image/upload/v1770078659/LOGO.PNG_i0uvv4.png">
    <title>Loading Profile - Direct Recruit</title>
    <link rel="stylesheet" href="../landingpage/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .loading-container {
            text-align: center;
            color: white;
            display: none; /* Hidden by default - only show on error */
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 112, 243, 0.3);
            border-top-color: #0070f3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.125rem;
            color: rgba(255, 255, 255, 0.8);
        }
        .error-message {
            color: #ff6b6b;
            display: none;
        }
    </style>
<script src="sw-register.js"></script>
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading profile...</p>
        <p class="error-message" id="errorMessage"></p>
    </div>

    <script src="./api.js"></script>
    <script src="./view-profile.js"></script>
</body>
</html>
