<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1128">
    <link rel="icon" type="image/png" href="../assets/dr-logo.png">
    <title>Payment Successful - Direct Recruit</title>
    <link rel="stylesheet" href="../landingpage/styles.css">
    <link rel="stylesheet" href="ios-app-overrides.css?v=1">
    <style>
        .ps-section { display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 70px);padding:40px 20px; }
        .ps-container { text-align:center;max-width:500px; }
        .ps-icon { width:64px;height:64px;margin:0 auto 24px;color:#22c55e; }
        .ps-title { color:#fff;font-size:24px;font-weight:700;margin:0 0 12px; }
        .ps-message { color:rgba(255,255,255,0.6);font-size:15px;line-height:1.6;margin:0; }
        .ps-link { color:#1282a2; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="capacitor-init.js"></script>
</head>
<body>
    <section class="ps-section">
        <div class="ps-container">
            <div class="ps-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h1 class="ps-title" id="statusTitle">Payment Successful!</h1>
            <p class="ps-message" id="statusMessage">Your subscription is active. Redirecting to your dashboard...</p>
        </div>
    </section>

    <script src="payment-success-switch.js"></script>
</body>
</html>
