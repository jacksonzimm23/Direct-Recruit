<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1128">

    <style>
        /* Match feed page layout - no extra max-width constraint */
        .post-view-container {
            padding: 0;
        }

        .post-view-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(18, 130, 162, 0.2);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: none;
            border: none;
            color: var(--cerulean);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(18, 130, 162, 0.1);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .post-view-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--white);
        }

        /* Match feed page post card styling exactly */
        .post-view-content {
            overflow: hidden;
        }

        .post-view-content .post-card {
            cursor: default;
            transform: none !important;
        }

        .post-view-content .post-card:hover {
            transform: none !important;
        }

        /* Hide the arrow icon on single post view */
        .post-view-content .post-view-icon {
            display: none;
        }

        /* Disable click navigation on post content */
        .post-view-content .post-content {
            cursor: default;
        }

        /* Use feed.css defaults for post content and media - no overrides needed */

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: rgba(254, 252, 251, 0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(18, 130, 162, 0.2);
            border-top-color: var(--cerulean);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 3rem;
            color: rgba(254, 252, 251, 0.6);
        }

        .error-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Comments section always visible on post view */
        .post-view-content .post-comments-section {
            display: block !important;
            border-top: 1px solid rgba(18, 130, 162, 0.2);
            padding: 1.5rem;
        }

        /* Better spacing for comments */
        .post-view-content .post-stats {
            padding: 0.75rem 0;
        }

        .post-view-content .post-actions-bar {
            padding: 0.75rem 0;
            border-top: 1px solid rgba(18, 130, 162, 0.15);
            border-bottom: 1px solid rgba(18, 130, 162, 0.15);
            margin: 0.5rem 0;
        }

        /* Responsive adjustments - let feed.css and mobile-overrides.css handle most styling */
        @media (max-width: 768px) {
            .post-view-header {
                padding: 0.75rem 0;
            }
        }
    </style>
<script src="../../shared/capacitor-init.js"></script>
<script src="../../shared/mobile-web-redirect.js"></script>
<script src="../../shared/sw-register.js"></script>
</head>
<body class="dashboard-body profile-type-player">

    <!-- Main Container -->
    <div class="dashboard-container no-right-sidebar" id="dashboardContainer">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="../../assets/dr-logo.png" alt="Direct Recruit Logo" class="logo-icon">
                    <div class="logo-text">
                        <span class="logo-title">Direct Recruit</span>
                        <span class="logo-subtitle">GET RECRUITED &middot; THE RIGHT WAY</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items injected by sidebar-nav.js -->
            </nav>

            <div class="sidebar-footer">

        <!-- Main Content -->
        <main class="main-content">

                    <button class="back-btn" onclick="goBack()">

                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        Back

                <div class="post-view-content" id="postViewContent">

    <!-- Toast Container -->

    <script src="../../shared/api.js"></script>
    <script src="../../shared/school-search.js"></script>
    <script src="../../shared/report-modal.js"></script>
    <script src="../../shared/block-helpers.js"></script>
    <script src="../../shared/mobile-header.js?v=4"></script>
    <script src="../sidebar-nav.js"></script>
    <script src="../sidebar-footer.js"></script>
    <script src="../../shared/feed.js"></script>
    <script src="../mainpage-player.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const shareId = urlParams.get('share'); // For quote/repost posts
        const referrer = urlParams.get('ref') || 'feed';

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else if (referrer === 'profile') {
                window.location.href = 'my-profile.html';
            } else {
                window.location.href = '../mainpage-player.html';
            }
        }

        function highlightSidebarNav() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            let targetHref = '';
            if (referrer === 'profile') {
                targetHref = 'my-profile.html';
            } else {
                targetHref = '../mainpage-player.html';
            }

            document.querySelectorAll('.nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (href && (href.includes(targetHref) || (referrer === 'feed' && href.includes('mainpage')))) {
                    item.classList.add('active');
                }
            });
        }

        async function loadPost() {
            const container = document.getElementById('postViewContent');

            if (!postId && !shareId) {
                container.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Post not found</p>
                    </div>
                `;
                return;
            }

            try {
                let postElement;
                let targetPostId;

                if (typeof FeedManager !== 'undefined') {
                    feedManager = new FeedManager(true);
                    feedManager.feedContainer = container;
                    await feedManager.loadCurrentUser();

                    if (shareId) {
                        // Load a share (quote/repost)
                        const response = await API.get(`/posts/share/${shareId}`);
                        if (!response.share) {
                            throw new Error('Share not found');
                        }

                        const share = response.share;
                        targetPostId = share.original_post_id;

                        if (share.is_quote) {
                            postElement = feedManager.createSingleQuotePostElement(share);
                        } else {
                            postElement = feedManager.createPostElement(share);
                        }
                    } else {
                        const response = await API.get(`/posts/${postId}`);
                        if (!response.post) {
                            throw new Error('Post not found');
                        }
                        targetPostId = postId;
                        postElement = feedManager.createPostElement(response.post);
                    }

                    container.innerHTML = '';
                    container.appendChild(postElement);

                    const commentsSection = postElement.querySelector('.post-comments-section');
                    if (commentsSection) {
                        commentsSection.style.display = 'block';
                        // Quote posts keep their comments on the SHARE, in #share-comments-<shareId>.
                        // loadComments(targetPostId) looked for #comments-<originalPostId>,
                        // found nothing and returned silently — which is why quote posts
                        // showed an empty comment list. Route on the section the template
                        // actually rendered.
                        const _sid = commentsSection.id || '';
                        if (_sid.indexOf('share-comments-') === 0) {
                            feedManager.loadShareComments(_sid.slice('share-comments-'.length), commentsSection);
                        } else {
                            feedManager.loadComments(targetPostId, commentsSection);
                        }
                        // Arrived from a Comment tap in the iOS app (&focus=comment):
                        // put the cursor in the box rather than making them hunt for it.
                        if (urlParams.get('focus') === 'comment') {
                            setTimeout(function () { feedManager.focusCommentInput(); }, 300);
                        }
                    }
                } else {
                    throw new Error('Feed manager not available');
                }
            } catch (error) {
                console.error('Error loading post:', error);
                container.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Failed to load post</p>
                        <button class="back-btn" onclick="goBack()" style="margin-top: 1rem;">Go Back</button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            highlightSidebarNav();
            loadPost();
        });
    </script>
</body>
</html>
